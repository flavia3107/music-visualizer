<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Visualizer Studio</title>
	<link rel="stylesheet" href="style.css">
	<link rel="stylesheet"
		href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />

	<script type="module" src="main.js" defer></script>
</head>

<body class="flex-column">
	<header>
		<a href="https://all-projects-portfolio.web.app/" target="_blank">
			<img src="./images/logo.svg" />
		</a>
	</header>
	<div class="ui-container">
		<div class="main-content">
			<aside class="left-panel">
				<div class="panel">
					<h2>Audio Source</h2>
					<div class="control-group flex-row space-between middle">
						<span class="element song-title">
							<span id="file-name-input">Select File</span>
						</span>
						<span class="material-symbols-outlined element" id="btn-select-file" title="Choose Audio File">
							folder
						</span>
						<input type="file" id="audio-file-input" accept="audio/*" style="display: none;">
					</div>
				</div>

				<div class="playlist panel"> </div>
			</aside>

			<div class="center-spacer flex-column">
				<canvas id="mainCanvas"></canvas>
				<footer class="playback-bar flex-column  space-between middle ">
					<div class="flex-row space-between middle progress">
						<span class="time">00:00</span>
						<input type="range" class="scrubber progress-scrubber" value="0" min="0" step="0.1">
						<span class="time">00:00</span>
					</div>

					<div class="playback-controls-bar flex-row middle space-between">
						<div class="control-spacer"> </div>

						<div class="player-controls flex-row middle">
							<button class="action-btn shuffle" data-action="shuffle" aria-label="Shuffle">
								<span class="material-symbols-outlined">shuffle</span>
							</button>
							<button class="action-btn" data-action="prev" aria-label="Previous track">
								<span class="material-symbols-outlined">fast_rewind</span>
							</button>
							<button class="action-btn" data-action="play-pause" aria-label="Play / Pause">
								<span class="material-symbols-outlined">play_arrow</span>
							</button>
							<button class="action-btn" data-action="next" aria-label="Next track">
								<span class="material-symbols-outlined">fast_forward</span>
							</button>
							<button class="action-btn repeat" data-action="repeat" aria-label="Repeat">
								<span class="material-symbols-outlined">repeat</span>
							</button>
						</div>

						<div class="volume-control flex-row middle">
							<div class="volume-part">
								<button class="action-btn mute-btn" aria-label="Mute / Unmute">
									<span class="material-symbols-outlined volume-icon">volume_up</span>
								</button>
								<input type="range" class="scrubber volume-scrubber" value="100" min="0" max="100"
									step="1" aria-label="Volume">
								<span class="volume-value">100%</span>
							</div>
							<div class="fullscreen">
								<button class="btn-party action-btn element">
									<span class="material-symbols-outlined fullscreen-icon"> fullscreen</span>
								</button>
							</div>
						</div>
					</div>

				</footer>
			</div>

			<aside class="right-panel">
				<div class="panel fit-content">
					<!-- <section>
						<h2>Multiple Visualization Modes</h2>
						<div class="modes-grid flex-row">
							<div class="mode-item flex-row space-between element active">Radial Bars</div>
							<div class="mode-item flex-row space-between element">Waveform Curve</div>
							<div class="mode-item flex-row space-between element">Spectral Peak</div>
							<div class="mode-item flex-row space-between element">Particle Flow</div>
						</div>
					</section> -->

					<section class="theme-container">
						<h2>Color Themes</h2>
					</section>
				</div>
			</aside>
		</div>
	</div>
</body>

</html>
